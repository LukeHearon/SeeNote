name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild (e.g. v0.10.0)'
        required: true

jobs:
  # tauri-action seeds latest.json from the copy already attached to the release
  # and then refuses to replace existing darwin-* entries (the "Don't overwrite
  # native builds" guard in its upload-version-json.ts). On a workflow_dispatch
  # rebuild of an existing tag, the macOS job therefore re-signs a brand new
  # SeeNote_universal.app.tar.gz while latest.json keeps the signature from the
  # *previous* build — every macOS client then fails with "signature
  # verification failed". Upstream fixed this in tauri-apps/tauri-action#1186,
  # but only on `dev`; the released v0 line (v0.6.2) still has the bug. Deleting
  # the stale manifest before the matrix starts forces the darwin entries to be
  # written from this run's signatures.
  reset-updater-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete any stale latest.json from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          REPO="${{ github.repository }}"
          RELEASE_ID=$(gh api "repos/${REPO}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          if [ -z "$RELEASE_ID" ]; then
            echo "No release for $TAG yet — nothing to clean."
            exit 0
          fi
          ASSET_IDS=$(gh api "repos/${REPO}/releases/${RELEASE_ID}/assets" --paginate \
            --jq '.[] | select(.name == "latest.json") | .id')
          if [ -z "$ASSET_IDS" ]; then
            echo "No existing latest.json — nothing to clean."
            exit 0
          fi
          for id in $ASSET_IDS; do
            gh api -X DELETE "repos/${REPO}/releases/assets/${id}"
            echo "Deleted stale latest.json asset $id"
          done

  build:
    needs: reset-updater-manifest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin --bundles dmg,app
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: --bundles appimage,deb
            rust-targets: ''
          - platform: windows-latest
            args: --bundles nsis
            rust-targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # Signs the .app with a self-signed certificate. This does not satisfy
      # Gatekeeper (users still see the unidentified-developer dialog once),
      # but it gives the bundle a stable designated requirement so macOS keeps
      # folder-access and Keychain approvals across relaunches and updates.
      # Generate the cert with scripts/macos-signing-cert.sh.
      - name: Import macOS signing certificate
        if: matrix.platform == 'macos-latest'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "MACOS_CERTIFICATE not set — building unsigned."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          # codesign refuses to build a chain to an untrusted self-signed root,
          # so the leaf has to be trusted on the runner itself.
          # System LibreSSL, not the Homebrew OpenSSL 3 on PATH — the latter
          # needs the legacy provider to read the 3DES-encrypted p12.
          /usr/bin/openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" \
            -passin pass:"$MACOS_CERTIFICATE_PASSWORD" \
            -nokeys -clcerts -out "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"

          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/cert.pem"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          # Signs the updater artifacts (.sig files + latest.json) so the app
          # can verify downloaded updates before installing them. Unrelated to
          # the macOS code-signing cert above. Generate with
          # `npx tauri signer generate`; see scripts/macos-signing-cert.sh for
          # the analogous macOS key-generation flow.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: SeeNote ${{ inputs.tag || github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Guards against silently shipping an unsigned bundle: a linker-adhoc binary
  # reports "Sealed Resources=none" and no designated requirement, which is
  # exactly the state that makes macOS re-prompt for permissions on every
  # launch and update.
  #
  # This checks the published DMG rather than the build tree: the tree is not
  # reliably still there once tauri-action finishes, and the shipped artifact
  # is what actually matters anyway.
  verify-macos-signature:
    needs: build
    runs-on: macos-latest
    permissions:
      # write, not read: draft releases are only visible to tokens with push access
      contents: write
    steps:
      - name: Verify signature on the published DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ -z "$MACOS_SIGNING_IDENTITY" ]; then
            echo "No signing identity configured — skipping verification."
            exit 0
          fi

          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.dmg' -D . --clobber
          DMG=$(ls ./*.dmg | head -1)
          echo "Verifying $DMG"

          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint ./mnt >/dev/null
          trap 'hdiutil detach ./mnt -quiet || true' EXIT
          APP=./mnt/SeeNote.app

          codesign -dvvv "$APP"
          codesign -d -r- "$APP"
          codesign --verify --strict --verbose=2 "$APP"

          # An ad-hoc/linker signature has no designated requirement at all,
          # so this is the assertion that actually catches a regression.
          if ! codesign -d -r- "$APP" 2>&1 | grep -q 'designated =>'; then
            echo "No designated requirement — bundle is effectively unsigned." >&2
            exit 1
          fi

  # The failure mode this catches: latest.json advertising a minisign signature
  # that doesn't belong to the artifact it points at, which makes the in-app
  # updater fail with "signature verification failed" for every user. Each
  # platform entry's signature must be byte-identical to the sidecar .sig
  # published next to the artifact named in its URL.
  verify-updater-manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # write, not read: draft releases are only visible to tokens with push access
      contents: write
    steps:
      - name: Verify latest.json signatures match the published artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" \
            -p latest.json -p '*.sig' -D . --clobber
          python3 - <<'PY'
          import json, os, sys

          manifest = json.load(open('latest.json'))
          failed = False
          for name, platform in manifest['platforms'].items():
              sidecar = os.path.basename(platform['url']) + '.sig'
              if not os.path.exists(sidecar):
                  print(f'FAIL {name}: no {sidecar} published alongside the artifact')
                  failed = True
                  continue
              expected = open(sidecar).read().strip()
              if platform['signature'].strip() != expected:
                  print(f'FAIL {name}: latest.json signature does not match {sidecar}')
                  failed = True
              else:
                  print(f'ok   {name} -> {sidecar}')
          sys.exit(1 if failed else 0)
          PY

  rename-assets:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # latest.json points updater clients at the original raw-named
      # installers for Linux and Windows (there's no separate updater
      # artifact for those platforms, unlike macOS's .app.tar.gz). Renaming
      # those files would 404 the updater, so we publish friendly-named
      # copies alongside the originals instead of renaming in place.
      - name: Publish user-friendly copies of release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          REPO="${{ github.repository }}"
          RELEASE_ID=$(gh api "repos/${REPO}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id")

          copy_asset() {
            local from="$1"
            local to="$2"
            local url
            url=$(gh api "repos/${REPO}/releases/${RELEASE_ID}/assets" --paginate \
              --jq ".[] | select(.name == \"$from\") | .browser_download_url")
            if [ -n "$url" ]; then
              curl -sL "$url" -o "$to"
              gh release upload "$TAG" "$to" -R "$REPO" --clobber
              echo "Published: $from -> $to"
            else
              echo "Skipped (not found): $from"
            fi
          }

          copy_asset "SeeNote_${VERSION}_universal.dmg"    "SeeNote-macOS.dmg"
          copy_asset "SeeNote_${VERSION}_amd64.AppImage"   "SeeNote-Linux.AppImage"
          copy_asset "SeeNote_${VERSION}_amd64.deb"        "SeeNote-Linux.deb"
          copy_asset "SeeNote_${VERSION}_x64-setup.exe"    "SeeNote-Windows.exe"

